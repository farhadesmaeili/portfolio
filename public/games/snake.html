<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>snake.exe</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #0a0a0a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: 'Courier New', monospace;
        color: #00ff41;
        overflow: hidden;
        user-select: none;
      }
      header {
        text-align: center;
        margin-bottom: 14px;
      }
      header h1 {
        font-size: 1.1rem;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        text-shadow: 0 0 14px #00ff41;
      }
      #score-display {
        font-size: 0.7rem;
        opacity: 0.65;
        letter-spacing: 0.15em;
        margin-top: 5px;
      }
      #canvas-wrap {
        position: relative;
        border: 1px solid rgba(0, 255, 65, 0.25);
        box-shadow:
          0 0 40px rgba(0, 255, 65, 0.08),
          inset 0 0 40px rgba(0, 0, 0, 0.6);
      }
      canvas {
        display: block;
      }
      #overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.88);
        backdrop-filter: blur(6px);
      }
      #overlay-title {
        font-size: 1.3rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        text-shadow: 0 0 18px #00ff41;
        margin-bottom: 6px;
      }
      #overlay-sub {
        font-size: 0.65rem;
        opacity: 0.55;
        letter-spacing: 0.2em;
        margin-bottom: 28px;
      }
      #start-btn {
        background: transparent;
        border: 1px solid rgba(0, 255, 65, 0.45);
        color: #00ff41;
        font-family: 'Courier New', monospace;
        font-size: 0.7rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        padding: 11px 30px;
        cursor: pointer;
        transition: all 0.2s;
      }
      #start-btn:hover {
        background: rgba(0, 255, 65, 0.1);
        border-color: #00ff41;
        box-shadow: 0 0 22px rgba(0, 255, 65, 0.28);
      }
      footer {
        margin-top: 12px;
        font-size: 0.6rem;
        opacity: 0.35;
        letter-spacing: 0.15em;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>snake.exe</h1>
      <div id="score-display">
        SCORE: <span id="score">000</span> &nbsp;|&nbsp; BEST:
        <span id="best">000</span>
      </div>
    </header>

    <div id="canvas-wrap">
      <canvas id="c"></canvas>
      <div id="overlay">
        <h2 id="overlay-title">INITIALIZE</h2>
        <p id="overlay-sub">WASD OR ARROW KEYS TO MOVE</p>
        <button id="start-btn">[ BOOT SYSTEM ]</button>
      </div>
    </div>

    <footer>// avoid stack overflow — eat data packets</footer>

    <script>
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');
      const overlay = document.getElementById('overlay');
      const startBtn = document.getElementById('start-btn');
      const scoreEl = document.getElementById('score');
      const bestEl = document.getElementById('best');
      const overlayTitle = document.getElementById('overlay-title');
      const overlaySub = document.getElementById('overlay-sub');

      const COLS = 20;
      const ROWS = 20;

      function calcSize() {
        // Reserve ~100px for header + footer inside the iframe
        const maxPx = Math.min(window.innerWidth - 4, window.innerHeight - 100, 400);
        return Math.floor(maxPx / COLS) * COLS; // snap to grid multiple
      }

      let SIZE = calcSize();
      let CELL = SIZE / COLS;
      let W = SIZE;
      let H = SIZE;

      function resizeCanvas() {
        SIZE = calcSize();
        CELL = SIZE / COLS;
        W = SIZE;
        H = SIZE;
        canvas.width = W;
        canvas.height = H;
        document.getElementById('canvas-wrap').style.width = W + 'px';
      }

      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      let snake, dir, nextDir, food, score, best, gameLoop, state;
      best = 0;

      function init() {
        snake = [
          { x: 10, y: 10 },
          { x: 9, y: 10 },
          { x: 8, y: 10 },
        ];
        dir = { x: 1, y: 0 };
        nextDir = { x: 1, y: 0 };
        score = 0;
        state = 'playing';
        spawnFood();
        updateScore();
        overlay.style.display = 'none';
        clearInterval(gameLoop);
        gameLoop = setInterval(tick, 115);
        draw();
      }

      function spawnFood() {
        do {
          food = {
            x: Math.floor(Math.random() * COLS),
            y: Math.floor(Math.random() * ROWS),
          };
        } while (snake.some((s) => s.x === food.x && s.y === food.y));
      }

      function updateScore() {
        scoreEl.textContent = String(score).padStart(3, '0');
        if (score > best) {
          best = score;
          bestEl.textContent = String(best).padStart(3, '0');
        }
      }

      function tick() {
        dir = nextDir;
        const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

        if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
          return gameOver();
        }
        if (snake.some((s) => s.x === head.x && s.y === head.y)) {
          return gameOver();
        }

        snake.unshift(head);

        if (head.x === food.x && head.y === food.y) {
          score++;
          updateScore();
          spawnFood();
        } else {
          snake.pop();
        }

        draw();
      }

      function gameOver() {
        clearInterval(gameLoop);
        state = 'dead';
        drawDeathFlash();
        setTimeout(() => {
          overlayTitle.textContent = 'STACK OVERFLOW';
          overlaySub.textContent = 'SCORE: ' + String(score).padStart(3, '0');
          startBtn.textContent = '[ RESTART ]';
          overlay.style.display = 'flex';
        }, 380);
      }

      function drawDeathFlash() {
        ctx.fillStyle = 'rgba(255, 40, 40, 0.22)';
        ctx.fillRect(0, 0, W, H);
      }

      function draw() {
        ctx.fillStyle = '#0a0a0a';
        ctx.fillRect(0, 0, W, H);

        // Grid
        ctx.strokeStyle = 'rgba(0,255,65,0.04)';
        ctx.lineWidth = 0.5;
        for (let x = 0; x <= COLS; x++) {
          ctx.beginPath();
          ctx.moveTo(x * CELL, 0);
          ctx.lineTo(x * CELL, H);
          ctx.stroke();
        }
        for (let y = 0; y <= ROWS; y++) {
          ctx.beginPath();
          ctx.moveTo(0, y * CELL);
          ctx.lineTo(W, y * CELL);
          ctx.stroke();
        }

        // Food — pulsing data packet
        const pulse = 0.5 + 0.5 * Math.sin(Date.now() * 0.006);
        const fx = food.x * CELL + CELL / 2;
        const fy = food.y * CELL + CELL / 2;
        const fr = 4 + pulse * 2.5;
        const glow = ctx.createRadialGradient(fx, fy, 0, fx, fy, fr * 3.5);
        glow.addColorStop(0, 'rgba(0,212,255,' + (0.55 + pulse * 0.4) + ')');
        glow.addColorStop(1, 'transparent');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(fx, fy, fr * 3.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowColor = '#00d4ff';
        ctx.shadowBlur = 14;
        ctx.fillStyle = 'rgba(0,212,255,' + (0.75 + pulse * 0.25) + ')';
        ctx.beginPath();
        ctx.arc(fx, fy, fr, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Snake segments
        snake.forEach((seg, i) => {
          const isHead = i === 0;
          const alpha = isHead ? 1 : Math.max(0.3, 1 - i * 0.038);
          const x = seg.x * CELL;
          const y = seg.y * CELL;
          const pad = isHead ? 1 : 2;

          if (isHead) {
            ctx.shadowColor = '#00ff41';
            ctx.shadowBlur = 16;
          }
          ctx.fillStyle = 'rgba(0,255,65,' + alpha + ')';
          ctx.fillRect(x + pad, y + pad, CELL - pad * 2, CELL - pad * 2);
          ctx.shadowBlur = 0;

          if (isHead) {
            ctx.fillStyle = 'rgba(255,255,255,0.12)';
            ctx.fillRect(x + pad + 2, y + pad + 2, CELL - pad * 2 - 4, 3);
          }
        });
      }

      document.addEventListener('keydown', function (e) {
        if (state !== 'playing') return;
        switch (e.key) {
          case 'ArrowUp':
          case 'w':
          case 'W':
            if (dir.y !== 1) nextDir = { x: 0, y: -1 };
            e.preventDefault();
            break;
          case 'ArrowDown':
          case 's':
          case 'S':
            if (dir.y !== -1) nextDir = { x: 0, y: 1 };
            e.preventDefault();
            break;
          case 'ArrowLeft':
          case 'a':
          case 'A':
            if (dir.x !== 1) nextDir = { x: -1, y: 0 };
            e.preventDefault();
            break;
          case 'ArrowRight':
          case 'd':
          case 'D':
            if (dir.x !== -1) nextDir = { x: 1, y: 0 };
            e.preventDefault();
            break;
        }
      });

      startBtn.addEventListener('click', init);

      // Touch swipe support
      let touchStartX = 0;
      let touchStartY = 0;

      canvas.addEventListener(
        'touchstart',
        function (e) {
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
          e.preventDefault();
        },
        { passive: false },
      );

      canvas.addEventListener(
        'touchend',
        function (e) {
          if (state !== 'playing') return;
          const dx = e.changedTouches[0].clientX - touchStartX;
          const dy = e.changedTouches[0].clientY - touchStartY;
          if (Math.abs(dx) > Math.abs(dy)) {
            if (dx > 20 && dir.x !== -1) nextDir = { x: 1, y: 0 };
            else if (dx < -20 && dir.x !== 1) nextDir = { x: -1, y: 0 };
          } else {
            if (dy > 20 && dir.y !== -1) nextDir = { x: 0, y: 1 };
            else if (dy < -20 && dir.y !== 1) nextDir = { x: 0, y: -1 };
          }
          e.preventDefault();
        },
        { passive: false },
      );

      // Initial blank render
      (function () {
        ctx.fillStyle = '#0a0a0a';
        ctx.fillRect(0, 0, W, H);
      })();
    </script>
  </body>
</html>
